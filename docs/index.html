полотенце под пяткой для снижения трения.",subtitles:[{from:0,to:6,text:"Лягте на спину, расслабьте плечи и поясницу."},{from:6,to:14,text:"Плавно подтягивайте пятку к себе, скользя по поверхности."},{from:14,to:19,text:"Зафиксируйте комфортное сгибание (лёгкое натяжение допустимо)."},{from:19,to:25,text:"Медленно выпрямите ногу и расслабьте мышцы."}],videoUrl:"https://www.youtube.com/results?search_query=heel+slides+knee+rehab+exercise"},{id:"ex3",name:"Мини-присед у стены",part:"Колено",phase:"Средняя",difficulty:"Средняя",sets:3,reps:8,restSec:40,workSec:30,targetRom:"Сгибание 30°–45°",instructions:"Прижмитесь спиной к стене, стопы на ширине плеч в 30 см от стены. Плавно скользите вниз до угла 30–45° в коленях, задержитесь на 3 секунды и вернитесь.",caution:"Выполняется только после разрешения врача на полную осевую нагрузку.",biomechanicsTip:"Следите, чтобы колени двигались строго по направлению вторых пальцев стоп и не заваливались внутрь (вальгус).",subtitles:[{from:0,to:7,text:"Прижмите лопатки и таз к стене, стопы на ширине плеч."},{from:7,to:16,text:"Медленно опуститесь вниз на 30–45 градусов, контролируя ось колена."},{from:16,to:23,text:"Удерживайте позицию, равномерно распределяя вес на обе стопы."},{from:23,to:30,text:"Плавно поднимитесь вверх, отталкиваясь пятками."}],videoUrl:"https://www.youtube.com/results?search_query=wall+mini+squat+knee+rehab"},{id:"ex3_late",name:"Шаг на невысокую платформу (Step-Up)",part:"Колено",phase:"Поздняя",difficulty:"Средняя",sets:3,reps:10,restSec:35,workSec:30,targetRom:"Полная стабилизация",instructions:"Поставьте реабилитируемую ногу на ступеньку (10–15 см), плавно перенесите вес тела и поднимитесь, контролируя стабильность колена, затем медленно опуститесь.",caution:"Избегайте резкого падения вниз на опорную ногу — фаза опускания должна длиться 2–3 секунды.",biomechanicsTip:"Держите таз ровно, не наклоняя корпус слишком сильно вперёд.",subtitles:[{from:0,to:8,text:"Поставьте всю стопу рабочей ноги на платформу."},{from:8,to:18,text:"Плавно выпрямите ногу, удерживая колено над центром стопы."},{from:18,to:30,text:"Подконтрольно и медленно вернитесь в исходное положение."}],videoUrl:"https://www.youtube.com/results?search_query=step+up+knee+rehabilitation"},{id:"ex4",name:"Маятник Кодмана плечом",part:"Плечо",phase:"Ранняя",difficulty:"Лёгкая",sets:2,reps:15,restSec:20,workSec:25,targetRom:"Пассивная декомпрессия",instructions:"Наклонитесь вперёд, опираясь здоровой рукой о стол. Дайте травмированной руке свободно повиснуть вниз и мягко раскачивайте её за счёт покачивания корпуса.",caution:"Рука двигается по инерции за счёт силы тяжести — не поднимайте её мышцами плеча.",biomechanicsTip:"Полностью расслабьте трапециевидную мышцу и шею.",subtitles:[{from:0,to:6,text:"Опритесь здоровой рукой о край стола, наклонив корпус вперёд."},{from:6,to:16,text:"Расслабьте больную руку и описывайте небольшие круги за счёт движения корпуса."},{from:16,to:25,text:"Дышите ровно, не зажимайте надплечье и шею."}],videoUrl:"https://www.youtube.com/results?search_query=codman+pendulum+shoulder+exercise"},{id:"ex4_mid",name:"Скольжение руками по стене (Wall Slide)",part:"Плечо",phase:"Средняя",difficulty:"Средняя",sets:3,reps:10,restSec:30,workSec:25,targetRom:"Сгибание до 135°",instructions:"Встаньте лицом к стене, положите предплечья на стену через салфетку и плавно скользите руками вверх до комфортной высоты, не поднимая плечи к ушам.",caution:"Не допускайте защемляющей боли в верхней части плеча (импинджмента).",biomechanicsTip:"Слегка сводите и опускайте лопатки вниз при движении рук вверх.",subtitles:[{from:0,to:6,text:"Прижмите предплечья к стене на уровне груди."},{from:6,to:16,text:"Плавно скользите вверх на выдохе, удерживая лопатки опущенными."},{from:16,to:25,text:"Медленно верните руки в исходную позицию."}],videoUrl:"https://www.youtube.com/results?search_query=shoulder+wall+slide+rehab"},{id:"ex5",name:"Наклоны согнутых коленей лёжа",part:"Спина",phase:"Ранняя",difficulty:"Лёгкая",sets:2,reps:10,restSec:25,workSec:20,targetRom:"Мягкая мобилизация L1–S1",instructions:"Лёжа на спине, колени согнуты, стопы на полу. Мягко наклоняйте оба колена вправо и влево в небольшой амплитуде, удерживая лопатки прижатыми к полу.",caution:"Амплитуда должна быть на 100% безболезненной и без прострелов в ногу.",biomechanicsTip:"Двигайтесь в такт спокойному дыханию, слегка подтянув низ живота.",subtitles:[{from:0,to:5,text:"Лягте на спину, согните колени, стопы поставьте вместе."},{from:5,to:13,text:"Плавно отведите колени в сторону на 20–30 градусов, плечи на полу."},{from:13,to:20,text:"На выдохе верните колени в центр и повторите в другую сторону."}],videoUrl:"https://www.youtube.com/results?search_query=supine+knee+rolls+lower+back+rehab"},{id:"ex5_mid",name:"Ягодичный мостик со стабилизацией кора",part:"Спина",phase:"Средняя",difficulty:"Средняя",sets:3,reps:10,restSec:30,workSec:25,targetRom:"Нейтральная поясница",instructions:"Лёжа на спине с согнутыми коленями, напрягите ягодицы и плавно поднимите таз до прямой линии от плеч до колен, не переразгибая поясницу.",caution:"Поднимайте таз за счёт ягодиц, избегая компрессии в поясничном отделе.",biomechanicsTip:"Представьте, что поднимаете позвонок за позвонком от коврика.",subtitles:[{from:0,to:6,text:"Стопы на ширине таза, прижмите поясницу к коврику."},{from:6,to:16,text:"На выдохе поднимите таз до прямой линии корпуса и бедер."},{from:16,to:25,text:"Плавно опустите таз вниз без резких движений."}],videoUrl:"https://www.youtube.com/results?search_query=glute+bridge+core+rehab"},{id:"ex6",name:"Изометрия предплечья и кисти",part:"Перелом руки",phase:"Ранняя",difficulty:"Лёгкая",sets:3,reps:10,restSec:20,workSec:15,targetRom:"Изометрический тонус",instructions:"Мягко сжимайте пальцы в неполный кулак и аккуратно напрягайте мышцы предплечья на 3 секунды без смещения в фиксированной области (если разрешено врачом).",caution:"Выполняйте только по согласованию с травматологом. При нарастании отёка пальцев поднимите руку выше уровня сердца.",biomechanicsTip:"Улучшает венозный отток и снижает отёк кисти во время иммобилизации.",subtitles:[{from:0,to:5,text:"Расположите руку на мягкой подушке чуть выше уровня локтя."},{from:5,to:10,text:"Мягко сожмите пальцы на 3 секунды, активируя венозный насос."},{from:10,to:15,text:"Полностью расправьте и расслабьте пальцы кисти."}],videoUrl:"https://www.youtube.com/results?search_query=forearm+isometric+hand+edema+rehab"},{id:"ex6_mid",name:"Активное сгибание и разгибание запястья",part:"Перелом руки",phase:"Средняя",difficulty:"Лёгкая",sets:3,reps:12,restSec:25,workSec:20,targetRom:"Сгибание/разгибание 45°",instructions:"Положите предплечье на стол так, чтобы кисть свисала с края. Медленно поднимайте тыльную сторону кисти вверх и плавно опускайте вниз.",caution:"Только после снятия гипса/ортеза и контрольного рентгена.",biomechanicsTip:"Используйте тепловую подготовку (по назначению врача) перед разработкой сустава.",subtitles:[{from:0,to:6,text:"Зафиксируйте предплечье на столе, кисть свободно свисает."},{from:6,to:14,text:"Плавно поднимите кисть вверх до лёгкого натяжения."},{from:14,to:20,text:"Медленно опустите кисть вниз, контролируя движение."}],videoUrl:"https://www.youtube.com/results?search_query=wrist+flexion+extension+after+cast"},{id:"ex7",name:"Дорсифлексия стопы («Насос»)",part:"Голеностоп",phase:"Ранняя",difficulty:"Лёгкая",sets:3,reps:15,restSec:20,workSec:20,targetRom:"Тыльное сгибание +15°",instructions:"Сидя или лёжа с выпрямленной ногой, плавно тяните носок стопы на себя, затем от себя в комфортной амплитуде.",caution:"Не вращайте стопу внутрь при свежем повреждении наружных связок.",biomechanicsTip:"Профилактика венозного застоя и тугоподвижности голеностопного сустава.",subtitles:[{from:0,to:6,text:"Выпрямите ногу на кушетке, пятка свободно лежит на опоре."},{from:6,to:13,text:"Плавно потяните носок стопы на себя, растягивая икроножную мышцу."},{from:13,to:20,text:"Мягко вытяните носок от себя и верните в нейтральное положение."}],videoUrl:"https://www.youtube.com/results?search_query=ankle+pumps+rehab+exercise"}],Gk={critical:[{id:"rf1",title:"Признаки тромбоза глубоких вен (ТГВ)",desc:"Резкий плотный отёк голени или бедра, распирающая боль в икроножной мышце, покраснение и жар кожи одной конечности.",action:"Немедленно прекратите упражнения, не массируйте ногу и вызовите скорую помощь (103 / 112)."},{id:"rf2",title:"Одышка или боль в грудной клетке",desc:"Внезапная нехватка воздуха, учащённое сердцебиение, боль в груди при вдохе или головокружение после операции.",action:"Экстренный вызов скорой помощи (103 / 112) — риск тромбоэмболии (ТЭЛА)."},{id:"rf3",title:"Потеря чувствительности или паралич стопы/кисти",desc:"Пальцы стали холодными, бледными или синюшными, пропала чувствительность («ватная» конечность) или невозможно пошевелить пальцами.",action:"Ослабьте давящую повязку/ортез и срочно обратитесь за неотложной помощью."}],urgent:[{id:"rf4",title:"Признаки инфекции послеоперационного шва",desc:"Температура тела выше 38.0 °C, усиление пульсирующей боли, расхождение краёв раны, мутное или гнойное отделяемое, растущее покраснение вокруг шва.",action:"Свяжитесь с оперировавшим хирургом или клиникой в течение 12–24 часов."},{id:"rf5",title:"Резкий скачок боли (8–10 баллов) или «блок» сустава",desc:"Острая боль, не стихающая в покое и после приёма назначенного обезболивающего, либо механическое заклинивание сустава со щелчком.",action:"Приостановите тренировки в приложении, зафиксируйте сустав в покое и запишитесь на внеплановый осмотр врача."}]},VW=[{id:"care_protein",category:"Питание",title:"Белковая поддержка (1.4–1.8 г/кг веса)",subtitle:"Рыба, птица, яйца, творог или растительный белок в каждом основном приёме пищи для синтеза коллагена и сохранения мышц."},{id:"care_vitc",category:"Питание",title:"Витамин C + Коллаген/Желатин за 45 мин до ЛФК",subtitle:"Клинически доказано ускоряет восстановление связок, сухожилий и хрящевой ткани (цитрусовые, киви, шиповник, болгарский перец)."},{id:"care_water",category:"Гидратация",title:"Водный баланс (30 мл на 1 кг массы тела)",subtitle:"Достаточная гидратация снижает вязкость синовиальной жидкости в суставах и помогает лимфодренажу отёка."},{id:"care_sleep",category:"Сон",title:"Глубокий сон 7.5–9 часов (до 23:00)",subtitle:"Во время фазы глубокого сна вырабатывается до 70% соматотропного гормона (гормона роста), отвечающего за регенерацию тканей."},{id:"care_elevation",category:"Режим",title:"Возвышенное положение и холод по протоколу",subtitle:"После тренировки подложите валик под конечность на 15–20 минут для уменьшения внутрисуставного выпота."}],GW=[{day:"Пн",pain:6,mobility:3,sleepHours:6.5,swelling:"Умеренный"},{day:"Вт",pain:5,mobility:3,sleepHours:7,swelling:"Умеренный"},{day:"Ср",pain:5,mobility:4,sleepHours:7.5,swelling:"Лёгкий"},{day:"Чт",pain:4,mobility:4,sleepHours:7.5,swelling:"Лёгкий"},{day:"Пт",pain:4,mobility:5,sleepHours:8,swelling:"Лёгкий"},{day:"Сб",pain:3,mobility:5,sleepHours:8,swelling:"Минимальный"},{day:"Вс",pain:3,mobility:6,sleepHours:8.5,swelling:"Минимальный"}],KW=[{id:"c1",date:"24 авг",type:"exercise",title:"Утренний комплекс упражнений",time:"09:00"},{id:"c2",date:"24 авг",type:"med",title:"Приём обезболивающего / хондропротектора",time:"13:00"},{id:"c3",date:"25 авг",type:"exercise",title:"Вечерний комплекс упражнений",time:"18:00"},{id:"c4",date:"29 авг",type:"doctor",title:"Приём у др. Окафор (контроль амплитуды)",time:"11:30"},{id:"c5",date:"02 сен",type:"doctor",title:"Контрольное УЗИ мягких тканей",time:"10:00"}],XW=[{id:"p1",author:"Марина",tag:"Колено · 6 недель",text:"Сегодня впервые прошла лестницу без опоры на перила! Маленькая победа, но очень рада. Главное — не пропускать изометрию в первые недели.",likes:14,status:"approved"},{id:"p2",author:"Игорь",tag:"Плечо · 3 недели",text:"У кого был небольшой вечерний отёк на 3-й неделе после маятника — врач сказал прикладывать холод через ткань на 10 минут, очень помогло!",likes:8,status:"approved"},{id:"p3",author:"Аня",tag:"Перелом руки · 8 недель",text:"Возвращаюсь к работе на следующей неделе. Амплитуда в запястье уже 85%. Спасибо всем за поддержку в этом чате 💛",likes:22,status:"approved"}],YW=[{id:"s1",category:"Боль и безопасность",q:"Нормально ли, что во время упражнения есть дискомфорт?",a:"Правило «Светофора боли»: боль 0–3 балла (лёгкое натяжение) — зелёный свет, продолжайте. Боль 4–5 баллов — жёлтый свет, снизьте амплитуду или число повторений, если боль проходит за 1 час после ЛФК. Боль ≥ 6 баллов, резкая/колющая боль или нарастающий отёк на следующее утро — красный свет: остановитесь и проконсультируйтесь с врачом."},{id:"s2",category:"Сроки",q:"Сколько длится типичное восстановление после травмы или операции?",a:"Биологическое заживление тканей идёт по фазам: воспалительная фаза (1–14 дней), фаза пролиферации и первичного коллагена (2–6 недель) и фаза ремоделирования (от 6 недель до 6–9 месяцев). Переход между фазами определяет врач по амплитуде, отёку и мышечному контролю."},{id:"s3",category:"Режим",q:"Можно ли пропустить день тренировок при усталости?",a:"Да! Если вы плохо спали (< 6 часов) или чувствуете реактивный отёк сустава после вчерашней нагрузки, лучше заменить активную силовую сессию на лёгкую лимфодренажную разминку и отдых."},{id:"s4",category:"Криотерапия",q:"Нужно ли прикладывать лёд после упражнений?",a:"При реактивном отёке и локальном повышении температуры сустава холод прикладывают на 10–15 минут строго через полотенце (чтобы избежать холодового ожога). Не прикладывайте лёд непосредственно на область поверхностных нервов."}],QW=[{id:"l1",category:"Сон",title:"Почему глубокий сон критически важен для сращения тканей",body:"Во время медленноволнового (глубокого) сна гипофиз выделяет пиковые дозы соматотропного гормона (GH), который стимулирует фибробласты и хондроциты синтезировать новый коллаген. Недосып (менее 6 часов) повышает уровень кортизола, усиливает восприятие боли центральной нервной системой на 20–30% и замедляет регенерацию связок. Рекомендация: проветривайте спальню до 18–20 °C, используйте ортопедическую подушку под травмированную конечность и отключайте яркие экраны за 45 минут до сна."},{id:"l2",category:"Питание",title:"Клиническая нутрициология в период реабилитации",body:"После травмы или операции базовый расход энергии организма возрастает на 15–25% из-за процессов репарации тканей. Главная ошибка пациентов — резкое сокращение калорий из-за снижения подвижности, что приводит к саркопении (потере мышечной массы вокруг больного сустава). 1) Белок: 1.5–1.8 г на кг массы тела (рыба, индейка, яйца, творог, бобовые). 2) Витамин C + глицин/пролин: необходимы для сшивки волокон коллагена. 3) Омега-3 жирные кислоты и достаточное питьё (30 мл/кг): помогают мягко контролировать остаточное воспаление без блокировки регенерации."},{id:"l3",category:"Безопасность",title:"Почему нельзя «разрабатывать через острую боль»",body:"Агрессивная разработка сустава через резкую боль (7–10 баллов) вызывает защитный мышечный спазм, микрокровоизлияния и реактивный синовит (выпот в сустав), что парадоксально усиливает рубцевание и контрактуру. Эффективная реабилитация строится на дозированной прогрессии нагрузки, нейромышечном контроле и уважении к биологическим срокам заживления."}],pE="ainala_v2_";function Rr(e,t=1e3){return typeof e!="string"?"":e.replace(/[<>]/g,r=>r==="<"?"‹":"›").replace(/javascript:/gi,"").replace(/on\w+=/gi,"").slice(0,t)}function hE(e){if(!e||typeof e!="string")return null;const t=e.toLowerCase();return t.includes("задыха")||t.includes("одышк")||t.includes("боль в груд")||t.includes("тромб")||t.includes("отек")&&t.includes("икр")||t.includes("отёк")&&t.includes("икр")?{level:"critical",title:"Внимание: возможный сосудистый/тромбоэмболический риск",message:"Описанные симптомы (одышка, боль в груди или резкий отёк икры) требуют немедленной оценки врачом. Не выполняйте упражнения и обратитесь в скорую помощь (103 / 112)."}:t.includes("онемел")||t.includes("не чувствую пальц")||t.incl
