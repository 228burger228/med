<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F6B5C" />
    <meta name="description" content="Ainala — спутник безопасной реабилитации после травм и операций" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self';"
    />
    <title>Ainala — безопасная реабилитация</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231F6B5C'/%3E%3Cpath d='M6 17h5l2-5 4 10 3-7 2 2h4' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React заменит этот блок после запуска. Если он виден — приложение не стартовало. -->
    <div id="root">
      <div style="max-width: 440px; margin: 0 auto; padding: 48px 24px; font-family: system-ui, sans-serif; color: #15302b; text-align: center">
        <h1 style="font-size: 22px">Ainala</h1>
        <p style="color: #56675f; line-height: 1.5">
          Если это сообщение не исчезает — откройте <code>docs/index.html</code>
          или запустите <code>npm run dev</code>.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Исходный шаблон открыт без dev-сервера Vite (GitHub Pages или двойной клик) —
      // переходим к собранному приложению. В собранном docs/index.html этого тега /src/main.jsx нет.
      if (document.querySelector('script[src="/src/main.jsx"]') && !document.querySelector('script[src="/@vite/client"]')) {
        location.replace("docs/index.html");
      }
    </script>
  </body>
</html>
